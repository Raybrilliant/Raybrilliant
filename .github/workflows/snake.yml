name: Generate Snake

on:
  schedule:
    # Runs every day at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Generate snake SVGs (light + dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: raybrilliant
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#1B1F23&color_dots=#EBEDF0,#DBE3EE,#9BE9A8,#40C463,#216E39
            dist/github-contribution-grid-snake-dark.svg?color_snake=#C9D1D9&color_dots=#161B22,#033A16,#196C2E,#2EA043,#56D364

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
